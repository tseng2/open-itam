services:
  itagent-server:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
      # 构建期可覆盖的镜像源参数（默认值已在 Dockerfile 里，对中国网络友好）
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        GOPROXY: https://goproxy.cn,direct
    image: itagent-server:0.1.0
    container_name: itagent-server
    restart: unless-stopped
    ports:
      # host:container，对外暴露 8443（内网 HTTP，公网 TLS 由 NPM 反代做，见 architecture.md）
      - "8443:8443"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 这两个路径相对本 compose 文件所在目录 (deploy/server/)
      - ./configs/server.json:/app/configs/server.json:ro
      - ./data:/app/data
    healthcheck:
      # 无 token 请求返回 401 也算活着（证明 HTTP 栈 + 鉴权中间件工作）
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://127.0.0.1:8443/api/v1/devices"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - itagent

# Docker 默认会按 172.17→172.18→… 顺序抢占 /16 段，会撞上内网 172.20.0.0
# （这台 VM 上就撞过一次，直接导致 VM 从办公网失联）。显式固定到空闲段。
networks:
  itagent:
    name: itagent-net
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.240.0/24
          gateway: 192.168.240.1
